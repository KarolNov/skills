# Blueprint drift report, copied by /blueprint-setup (step 7, "Drift guard").
#
# On every pull request it runs `python3 .blueprint/drift.py check` and
# `python3 .blueprint/drift.py artifacts` and reports:
#   - drifted capabilities: their anchored code moved (code-moved), or code they
#     import moved enough to reach the drift threshold (deps-moved),
#   - possibly affected capabilities: imported code moved, below the threshold,
#   - artifacts (resources outside the repo that describe a capability) whose
#     capabilities' code changed since someone last checked them.
# Each capability shows its drift chance (0-1), confidence and the reasons for both.
# It leaves:
#   - one PR comment, updated on each push (and marked "back in sync" when all
#     three lists are empty),
#   - a ::warning annotation per drifted capability and per stale artifact, none
#     for a possibly affected one; fork PRs see them too (their token can't comment),
#   - a failed job only when BLUEPRINT_DRIFT_FAIL is "true" and a capability
#     drifted; possibly affected capabilities and stale artifacts never fail it.
# An older .blueprint/drift.py without the `artifacts` command still gets the
# drift report; the artifacts section is skipped with a notice. One that predates
# drift chances lists the changed files instead.
# Only code-side drift is checked; spec-side drift (someone edited a spec page)
# needs the backend, so `/blueprint-sync` and `/blueprint-drift` report it.
# Needs actions/checkout, actions/setup-node, python3 and gh, all on GitHub-hosted
# runners. The "Set up Node" step installs typescript from package.json so TS/JS
# imports are followed by symbol; without it they'd be followed by file, at low
# confidence.
#
# This is the recommended shape, not a fixed one: this copy belongs to the repo.
# Edit it to fit the team (add a "drifted" label, request a reviewer, change
# the wording or trigger); the steps after "Check drift" read its outputs
# (`drifted`, `possible`, `stale`, `artifacts_skipped`, and drift.json, artifacts.json and
# drift-comment.md in $RUNNER_TEMP, kept out of the checkout so the scan never
# counts them as changed files).

name: Blueprint drift

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  # "true" fails the job when drift is found; anything else only reports it.
  BLUEPRINT_DRIFT_FAIL: "false"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the repo's dependencies so drift.py follows TS/JS imports by symbol with
      # the repo's own typescript (pinned in package.json), which raises confidence for
      # those capabilities from low to medium. drift.py never installs anything itself.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Only typescript, at the version package-lock.json pins: the docs site's vitepress and
      # wrangler (also in package.json) aren't needed here.
      - name: Install typescript
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/typescript'].version")
          npm install --prefix "$RUNNER_TEMP/ts" --no-save --no-audit --no-fund "typescript@$version"
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/ts/node_modules/typescript" node_modules/typescript

      - name: Check drift
        id: check
        run: |
          # Outputs go to $RUNNER_TEMP: untracked files in the checkout would count as changed.
          out="$RUNNER_TEMP"
          set +e
          python3 .blueprint/drift.py check --json > "$out/drift.json"
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error::drift.py check failed (exit $code)"
            cat "$out/drift.json"
            exit "$code"
          fi
          # Stale artifacts. An older drift.py has no `artifacts` command: skip it.
          export ARTIFACTS_SKIPPED=false
          set +e
          python3 .blueprint/drift.py artifacts --json > "$out/artifacts.json" 2> "$out/artifacts.err"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -q "unknown command: artifacts" "$out/artifacts.err"; then
              echo "::notice title=Blueprint artifacts::.blueprint/drift.py predates artifacts; skipping the artifacts section. Refresh it from the blueprint skill to list them."
              echo "[]" > "$out/artifacts.json"
              ARTIFACTS_SKIPPED=true
            else
              echo "::error::drift.py artifacts failed (exit $code)"
              cat "$out/artifacts.err"
              exit "$code"
            fi
          fi
          python3 - <<'PY'
          import json, os, re
          out = os.environ["RUNNER_TEMP"]
          report = json.load(open(f"{out}/drift.json"))
          moved = [r for r in report if r["status"] in ("code-moved", "deps-moved")]
          possible = [r for r in report if r["status"] == "possibly-affected"]
          skipped = os.environ["ARTIFACTS_SKIPPED"] == "true"
          stale = json.load(open(f"{out}/artifacts.json"))
          MAX_FILES = 10  # per artifact, so domain-wide ones keep the comment readable

          def code(text):
              """An inline code span that survives backticks inside text."""
              fence = "`" * (max((len(m) for m in re.findall(r"`+", text)), default=0) + 1)
              pad = " " if text.startswith("`") or text.endswith("`") else ""
              return f"{fence}{pad}{text}{pad}{fence}"

          def plain(text):
              """Text with markdown's inline syntax escaped, and @names (npm scopes like
              @org/pkg) in code spans so GitHub doesn't read them as mentions."""
              parts = re.split(r"(@[\w.-]+(?:/[\w.-]+)?)", text)
              return "".join(code(p) if i % 2 else re.sub(r"([\\`*_\[\]<>|])", r"\\\1", p)
                             for i, p in enumerate(parts))

          def annotation(text):
              """A workflow command's message, escaped so % and newlines survive."""
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def chance(r):
              """`chance 0.5 · confidence medium`, or "" from a drift.py that predates scores."""
              if "chance" not in r:
                  return ""
              return f"chance {r['chance']:g} · confidence {r.get('confidence', '?')}"

          FILL = {"high": "🟩", "medium": "🟨", "low": "🟥"}

          def meter(r):
              """`🟨🟨🟨🟨🟨⬜⬜⬜⬜⬜ 0.5 · medium`: 10 squares filled by the drift chance (rounded
              half up, at least 1 above 0), colored by the confidence."""
              c = r["chance"]
              n = 0 if c <= 0 else max(1, min(10, int(c * 10 + 0.5)))
              conf = r.get("confidence", "?")
              return f"{FILL.get(conf, '⬛') * n}{'⬜' * (10 - n)} {c:g} · {conf}"

          def capability(r):
              """A capability's comment entry: name, since, chance, then its reasons (or, from a
              drift.py that predates scores, its changed files)."""
              head = f"- **{code(r['capability'])}**"
              if r["status"] == "code-moved":
                  head += f" (since `{(r.get('syncedCommit') or '?')[:9]}`)"
              elif r["status"] == "deps-moved":
                  head += " (imported code moved)"
              if chance(r):
                  head += f": {meter(r)}"
              details = ([plain(x) for x in r["reasons"]] if "reasons" in r
                         else [code(f) for f in r.get("changed", [])])
              return [head] + [f"  - {d}" for d in details]

          def files(paths):
              shown = ", ".join(code(f) for f in paths[:MAX_FILES])
              more = len(paths) - MAX_FILES
              return shown + (f" and {more} more" if more > 0 else "")

          marker = "<!-- blueprint-drift -->"
          lines = [marker, "### Blueprint drift", ""]
          if moved:
              lines += [("1 capability drifted since its spec was last synced:" if len(moved) == 1
                         else f"{len(moved)} capabilities drifted since their specs were last synced:"),
                        ""]
              for r in moved:
                  lines += capability(r)
                  score = f" ({chance(r)})" if chance(r) else ""
                  if r["status"] == "code-moved":
                      since = (r.get("syncedCommit") or "?")[:9]
                      what = (f"{len(r['changed'])} anchored file(s) changed since {since}"
                              f"{score}: " + ", ".join(r["changed"]))
                  else:
                      causes = [x for x in r.get("reasons", []) if not x.startswith("confidence ")]
                      what = f"imported code moved{score}" + (": " + "; ".join(causes) if causes else "")
                  print(f"::warning title=Blueprint drift::{annotation(r['capability'] + ': ' + what)}")
              lines += ["", "If the code is right, run `/blueprint-sync <capability>` and commit "
                        "the updated `.blueprint/`; if the spec is right, run "
                        "`/blueprint-drift <capability>` to fix the code."]
          if possible:
              if moved:
                  lines.append("")
              lines += ["#### Possibly affected", "",
                        "Code these import changed, below the drift threshold: worth a look, "
                        "not counted as drift:", ""]
              for r in possible:
                  lines += capability(r)
          if stale:
              if moved or possible:
                  lines.append("")
              lines += ["#### Artifacts that may need an update", "",
                        "The code these describe changed since they were last checked:", ""]
              for a in stale:
                  if a.get("link"):
                      # <...> lets the URL hold parentheses; escape the brackets themselves.
                      url = a["link"].replace("<", "%3C").replace(">", "%3E").replace(" ", "%20")
                      value = f"[{plain(a['value'])}](<{url}>)"
                  else:
                      value = code(a["value"])
                  caps = ", ".join(code(c) for c in a.get("capabilities", []))
                  changed, unknown = a.get("changed", []), a.get("unknown", [])
                  lines.append(f"- **{code(a['id'])}** ({plain(a['type'])}) {value}: "
                               f"{plain(a['description'])}")
                  lines.append(f"  - covers {caps}"
                               + (f"; changed: {files(changed)}" if changed else ""))
                  if unknown:
                      lines.append("  - names " + ", ".join(code(u) for u in unknown)
                                   + ", no longer a capability or domain: fix its `capabilities` "
                                   "in `.blueprint/blueprint.json` before marking it checked")
                  what = f"{len(changed)} file(s) changed" if changed else "no files changed"
                  print("::warning title=Blueprint artifact::" + annotation(
                      f"{a['id']} ({a['value']}): {what}"
                      + (f"; unknown capability: {', '.join(unknown)}" if unknown else "")))
              lines += ["", "Once each is updated (or still accurate), run "
                        "`python3 .blueprint/drift.py artifacts checked <id>` and commit "
                        "`.blueprint/blueprint.json`."]
          if not moved and not possible and not stale:
              lines.append("Back in sync: no capability's code or imported code moved since its "
                           "spec was synced" + ("." if skipped else ", and no artifact needs a check."))
          # Only rows whose imports were followed by file: the Node step can't help others.
          low = any(r.get("confidence") == "low"
                    and any("imports are followed by file" in x for x in r.get("reasons", []))
                    for r in moved + possible)
          scored = any("chance" in r for r in moved + possible)
          lines += ["", "<sub>"
                    + ("Squares fill with the drift chance (0 to 1) and are colored by "
                       "confidence: 🟩 high, 🟨 medium, 🟥 low. " if scored else "")
                    + "Code-side drift only; spec pages edited outside the code are "
                    "reported by `/blueprint-sync`."
                    + (" Low confidence where imports weren't followed by symbol: the "
                       "workflow's commented-out Node step raises it for TS/JS capabilities."
                       if low else "")
                    + (" Artifacts skipped: `.blueprint/drift.py` predates them." if skipped else "")
                    + "</sub>"]
          body = "\n".join(lines) + "\n"
          LIMIT = 60000  # GitHub rejects comment bodies over 65,536 characters
          if len(body) > LIMIT:
              body = (body[:LIMIT].rsplit("\n", 1)[0] + "\n\n_Truncated: run "
                      "`python3 .blueprint/drift.py check` and `artifacts` locally for the rest._\n")
          open(f"{out}/drift-comment.md", "w").write(body)
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"drifted={len(moved)}\n")
              gh_out.write(f"possible={len(possible)}\n")
              gh_out.write(f"stale={len(stale)}\n")
              gh_out.write(f"artifacts_skipped={'true' if skipped else 'false'}\n")
          PY

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DRIFTED: ${{ steps.check.outputs.drifted }}
          POSSIBLE: ${{ steps.check.outputs.possible }}
          STALE: ${{ steps.check.outputs.stale }}
        run: |
          # Find this workflow's earlier comment, if any, by its hidden marker.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- blueprint-drift -->")) | .id' \
                 2>/dev/null | head -n 1) || id=""
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@"$RUNNER_TEMP/drift-comment.md" > /dev/null \
              || echo "::notice::Could not update the drift comment (fork PRs can't comment); see the warnings above."
          elif [ "$DRIFTED" != "0" ] || [ "$POSSIBLE" != "0" ] || [ "$STALE" != "0" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/drift-comment.md" > /dev/null \
              || echo "::notice::Could not comment on the PR (fork PRs can't comment); see the warnings above."
          fi

      # Possibly affected capabilities and stale artifacts never fail the job; only
      # drifted ones (code-moved, deps-moved) do.
      - name: Fail on drift
        if: env.BLUEPRINT_DRIFT_FAIL == 'true' && steps.check.outputs.drifted != '0'
        run: |
          echo "::error::${{ steps.check.outputs.drifted }} capability(ies) drifted; BLUEPRINT_DRIFT_FAIL is \"true\"."
          exit 1

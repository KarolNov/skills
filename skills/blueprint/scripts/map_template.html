<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capability map</title>
<!-- Written by skills/blueprint/scripts/graph.py: d3 and the data are inlined at the two markers below. -->
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e4e2dd;
  --node: #ffffff; --node-line: #b9b6ae; --domain: #f1efe9; --domain-line: #d9d5cb;
  --accent: #2f6fde; --edge: #8f8b82;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161617; --panel: #1f1f21; --ink: #ececee; --muted: #9a9aa0; --line: #333336;
    --node: #2a2a2d; --node-line: #55555a; --domain: #222225; --domain-line: #3a3a3e;
    --accent: #6ea0ff; --edge: #77777d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .tag { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
header .spacer { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
#graph { position: relative; overflow: hidden; min-height: 0; }
#graph .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px; min-height: 0; }
aside h2 { font-size: 15px; margin: 0 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
aside p { margin: 6px 0; } aside .muted { color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
}

svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }
.hull { fill: var(--domain); stroke: var(--domain-line); stroke-dasharray: 5 4; }
.hull-label { fill: var(--muted); font-size: 13px; font-weight: 600; pointer-events: none; }
.share { stroke: var(--edge); stroke-opacity: .7; fill: none; }
.share-label { fill: var(--muted); font-size: 10px; pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.share-label.spare { opacity: 0; }
.cap { cursor: pointer; }
.cap rect, .share, .share-label { transition: opacity .12s, stroke-opacity .12s; }
.focus .share:not(.on) { stroke-opacity: .06; }
.focus .share.on { stroke-opacity: .9; }
.focus .share-label:not(.on) { opacity: 0; }
.focus .share-label.on { opacity: 1; fill: var(--ink); }
.focus .cap:not(.on) { opacity: .3; }
.cap rect { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; }
.cap text { fill: var(--ink); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
</style>
<script>/*D3*/</script>
</head><body>
<div class="app">
  <header><h1>Capability map</h1><span class="tag" id="repo"></span><span class="spacer"></span>
    <button id="fit">Fit</button></header>
  <div id="graph"><div class="hint">scroll to zoom · drag to pan · hover or tap a capability for its lines</div></div>
  <aside id="panel"></aside>
</div>
<script>
const DATA = /*DATA*/;

// ---- data → graph -------------------------------------------------------
// Turns graph.py's output into what the canvas draws: capability nodes, one line per
// pair of capabilities sharing files (weighted by the count), and one outline per domain.
function toGraph(d) {
  return {
    domains: d.domains.filter((dom) => d.nodes.some((n) => n.domain === dom.id)),
    caps: d.nodes.map((n) => ({ id: n.id, label: n.id, domain: n.domain })),
    links: d.edges.map((e) => ({ id: e.source + "~" + e.target, source: e.source, target: e.target, count: e.count })),
  };
}

// Line width grows with the number of shared files, with a ceiling so big overlaps stay readable.
const lineWidth = (count) => Math.min(12, 1.2 + 1.6 * Math.sqrt(count));

// Keeps the boxes themselves apart, not circles around them: a long name is wide but only
// 26px tall, so a circle of half its width would push neighbours far away above and below.
function rectCollide(pad) {
  let nodes = [];
  function force(alpha) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = b.x + b.vx - a.x - a.vx, dy = b.y + b.vy - a.y - a.vy;
        const ox = (a.w + b.w) / 2 + pad - Math.abs(dx), oy = 26 + pad - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        // Separate along the axis that needs the smaller move.
        if (ox < oy) { const m = (dx < 0 ? -1 : 1) * ox * 0.5 * Math.min(1, alpha * 4); a.vx -= m; b.vx += m; }
        else { const m = (dy < 0 ? -1 : 1) * oy * 0.5 * Math.min(1, alpha * 4); a.vy -= m; b.vy += m; }
      }
    }
  }
  force.initialize = (n) => { nodes = n; };
  return force;
}

// ---- layout -------------------------------------------------------------
// Each domain is a cluster with a slot of its own; capabilities outside any domain share one
// more slot. Lines inside a cluster pull firmly, lines between clusters only lightly, so
// cross-domain sharing doesn't drag the clusters into one another. A force layout settles
// wherever its start lands, so several seeded starts (each also trying another order of the
// slots) are settled off screen and the least tangled is drawn. Same data, same picture.

const BARE = "\u0000bare";
const groupOf = (n) => n.domain || BARE;

// Where a line from a box's centre toward (tx, ty) leaves the box.
function edgePoint(n, tx, ty) {
  const dx = tx - n.x, dy = ty - n.y;
  const s = Math.min(0.5, dx ? n.w / 2 / Math.abs(dx) : Infinity, dy ? 13 / Math.abs(dy) : Infinity);
  return [n.x + dx * s, n.y + dy * s];
}

// A line's path. Inside a cluster it is straight. Between clusters it leaves through a port
// on its cluster's edge facing the other cluster and enters the other through the matching
// port, so every line between the same two clusters shares one band instead of fanning out.
// Ends stop at the box edges; segs (a polyline along the path) is what crossings are checked on.
function route(l, slot) {
  const a = l.source, b = l.target, ga = groupOf(a), gb = groupOf(b);
  const bundle = ga < gb ? ga + "|" + gb : gb + "|" + ga;
  if (ga === gb) {
    const p1 = edgePoint(a, b.x, b.y), p2 = edgePoint(b, a.x, a.y);
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    return { d: `M${p1}L${p2}`, mid: [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2], bundle, curved: false, length: len,
             segs: [{ x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }] };
  }
  const sa = slot[ga], sb = slot[gb], d = Math.hypot(sb.x - sa.x, sb.y - sa.y) || 1;
  const ux = (sb.x - sa.x) / d, uy = (sb.y - sa.y) / d;
  const qa = [sa.x + ux * sa.r * 0.8, sa.y + uy * sa.r * 0.8], qb = [sb.x - ux * sb.r * 0.8, sb.y - uy * sb.r * 0.8];
  const p1 = edgePoint(a, ...qa), p2 = edgePoint(b, ...qb);
  const pts = [p1, qa, qb, p2];
  const segs = pts.slice(1).map((q, i) => ({ x1: pts[i][0], y1: pts[i][1], x2: q[0], y2: q[1] }));
  return {
    d: d3.line().curve(d3.curveBundle.beta(0.9))(pts),
    mid: [(qa[0] + qb[0]) / 2, (qa[1] + qb[1]) / 2], bundle, curved: true,
    length: d3.sum(segs, (q) => Math.hypot(q.x2 - q.x1, q.y2 - q.y1)), segs,
  };
}

function crosses(p, q) {
  const o = (ax, ay, bx, by, cx, cy) => Math.sign((bx - ax) * (cy - ay) - (by - ay) * (cx - ax));
  return o(p.x1, p.y1, p.x2, p.y2, q.x1, q.y1) * o(p.x1, p.y1, p.x2, p.y2, q.x2, q.y2) < 0
      && o(q.x1, q.y1, q.x2, q.y2, p.x1, p.y1) * o(q.x1, q.y1, q.x2, q.y2, p.x2, p.y2) < 0;
}

// Does the segment pass through the box (grown by pad)? Liang–Barsky clipping.
function throughBox(l, n, pad) {
  const dx = l.x2 - l.x1, dy = l.y2 - l.y1;
  let t0 = 0, t1 = 1;
  for (const [p, q] of [[-dx, l.x1 - (n.x - n.w / 2 - pad)], [dx, n.x + n.w / 2 + pad - l.x1],
                        [-dy, l.y1 - (n.y - 13 - pad)], [dy, n.y + 13 + pad - l.y1]]) {
    if (p === 0) { if (q < 0) return false; continue; }
    const r = q / p;
    if (p < 0) { if (r > t1) return false; t0 = Math.max(t0, r); }
    else { if (r < t0) return false; t1 = Math.min(t1, r); }
  }
  return t0 < t1;
}

// The points a domain's outline wraps: a ring around each capability box.
function ringAround(pts) {
  return pts.flatMap((p) => d3.range(10).map((i) => [
    p.x + (p.w / 2 + 16) * Math.cos(i / 10 * 2 * Math.PI),
    p.y + 30 * Math.sin(i / 10 * 2 * Math.PI)]));
}

// How much a line matters to the eye, 0..1: heavier lines are drawn stronger.
const weightOf = (count, max) => Math.sqrt(count / max);

// Lower is cleaner. Counted, each weighted by how heavy the lines involved are: crossings
// (lines in one bundle may meet, that is the bundle), lines behind boxes, lines too short to
// hold their count, capabilities inside another domain's outline, boxes on boxes; then,
// between equally clean layouts, shorter lines.
function tangle(nodes, links, slot, max) {
  const rs = links.map((l) => ({ l, r: route(l, slot), wt: weightOf(l.count, max) }));
  let score = 0, length = 0;
  rs.forEach((p, i) => {
    length += p.r.length;
    if (p.r.length < 44) score += 0.3 * p.wt;
    for (const q of rs.slice(i + 1)) {
      const shared = [q.l.source, q.l.target].some((n) => n === p.l.source || n === p.l.target);
      if (shared || (p.r.curved && p.r.bundle === q.r.bundle)) continue;
      if (p.r.segs.some((ps) => q.r.segs.some((qs) => crosses(ps, qs)))) score += 0.3 + 0.7 * Math.sqrt(p.wt * q.wt);
    }
    for (const n of nodes) {
      if (n !== p.l.source && n !== p.l.target && p.r.segs.some((ps) => throughBox(ps, n, 6))) score += 0.5 + 0.5 * p.wt;
    }
  });
  for (const [dom, pts] of d3.group(nodes.filter((n) => n.domain), (n) => n.domain)) {
    const hull = d3.polygonHull(ringAround(pts));
    for (const n of nodes) if (n.domain !== dom && hull && d3.polygonContains(hull, [n.x, n.y])) score += 3;
  }
  nodes.forEach((a, i) => nodes.slice(i + 1).forEach((b) => {
    if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < 26) score += 1;
  }));
  return score + length / 1e5;
}

// Slot centres. Capabilities outside any domain (often shared infrastructure, linked to
// everything) sit in the middle, so their lines run out like spokes; domains go round them on
// a circle, far enough apart that neighbouring clusters, and the middle, don't touch.
function slotsFor(order, radius) {
  const hub = radius[BARE] !== undefined && order.length ? radius[BARE] : null;
  const slot = hub !== null ? { [BARE]: { x: 0, y: 0, r: hub } } : {};
  const k = order.length;
  if (k === 1 && hub === null) return { [order[0]]: { x: 0, y: 0, r: radius[order[0]] || 0 } };
  const ring = k > 1 ? (d3.max(order, (g, i) => radius[g] + radius[order[(i + 1) % k]]) + 50) / (2 * Math.sin(Math.PI / k)) : 0;
  const R = Math.max(ring, hub !== null ? d3.max(order, (g) => radius[g]) + hub + 50 : 0);
  order.forEach((g, i) => { slot[g] = { r: radius[g], x: Math.cos(i / k * 2 * Math.PI - Math.PI / 2) * R, y: Math.sin(i / k * 2 * Math.PI - Math.PI / 2) * R }; });
  return slot;
}

// The first order to try: biggest cluster first, then each next to the one it shares most with.
function linkedOrder(groups, size, between) {
  const left = new Set(groups), order = [];
  let cur = d3.greatest(groups, (g) => size[g]);
  while (cur !== undefined) {
    order.push(cur); left.delete(cur);
    cur = d3.greatest([...left], (g) => (between.get(cur + "|" + g) || 0) * 1000 + size[g]);
  }
  return order;
}

function settle(base, rawLinks, plan, seed) {
  const rand = d3.randomLcg(seed / 101);
  const ringed = plan.order;  // domains only; no-domain capabilities sit in the middle
  const order = seed ? d3.shuffler(rand)(ringed.slice()) : ringed;
  const slot = slotsFor(order, plan.radius), at = (n) => slot[groupOf(n)];
  const nodes = base.map((n) => ({ ...n })), links = rawLinks.map((l) => ({ ...l }));
  // Start 0 is d3's own spiral; the others scatter capabilities around their slots.
  nodes.forEach((n, i) => {
    const r = seed ? 300 * Math.sqrt(rand()) : 10 * Math.sqrt(i + 0.5), a = seed ? rand() * 2 * Math.PI : i * 2.4;
    n.x = at(n).x + r * Math.cos(a); n.y = at(n).y + r * Math.sin(a);
  });
  const inside = (l) => groupOf(l.source) === groupOf(l.target);
  d3.forceSimulation(nodes).randomSource(rand)
    .force("link", d3.forceLink(links).id((d) => d.id)
      .distance((l) => (l.source.w + l.target.w) / 2 + (inside(l) ? 40 : 90))
      .strength((l) => inside(l) ? 0.15 + 0.35 * weightOf(l.count, plan.max) : 0.04))
    .force("charge", d3.forceManyBody().strength(-380).distanceMax(400))
    .force("collide", rectCollide(12))
    .force("x", d3.forceX((d) => at(d).x).strength(0.12))
    .force("y", d3.forceY((d) => at(d).y).strength(0.12))
    .stop()
    .tick(400);
  return { nodes, links, slot, score: tangle(nodes, links, slot, plan.max) };
}

// Stops at a clean layout, or when the work budget runs out: each start costs about
// nodes² + links² + nodes·links, so big maps get fewer starts and the page still opens at
// once. A budget of work, not time, keeps the picture the same on every machine.
function layout(base, links) {
  const groups = [...new Set(base.map(groupOf))];
  const size = Object.fromEntries(groups.map((g) => [g, d3.sum(base, (n) => groupOf(n) === g ? 1 : 0)]));
  // A cluster's rough radius, from the area its boxes need with room around them.
  const radius = Object.fromEntries(groups.map((g) => [g,
    30 + 1.3 * Math.sqrt(d3.sum(base, (n) => groupOf(n) === g ? (n.w + 30) * 70 : 0) / Math.PI)]));
  const byId = new Map(base.map((n) => [n.id, n])), between = new Map();
  for (const l of links) {
    const a = groupOf(byId.get(l.source)), b = groupOf(byId.get(l.target));
    if (a !== b) for (const k of [a + "|" + b, b + "|" + a]) between.set(k, (between.get(k) || 0) + l.count);
  }
  const ringed = groups.filter((g) => g !== BARE || groups.length === 1);
  if (groups.length === 1) delete radius[BARE];  // a lone group, bare or not, just sits in the middle
  const plan = { radius, order: linkedOrder(ringed, size, between), max: d3.max(links, (l) => l.count) || 1 };
  const n = base.length, m = links.length;
  const starts = Math.max(1, Math.min(24, Math.floor(80000 / (n * n + m * m + n * m + 1))));
  let best = null;
  for (let seed = 0; seed < starts && (!best || best.score >= 1); seed++) {
    const c = settle(base, links, plan, seed);
    if (!best || c.score < best.score) best = c;
  }
  best.max = plan.max;
  return best;
}

// Counts are placed heaviest first; one that would sit on a box or another count is held
// back until its capability is hovered, so the default view never stacks text.
function placeCounts(links, nodes) {
  const placed = [];
  for (const l of [...links].sort((a, b) => b.count - a.count)) {
    const [x, y] = l.mid, w = 7 * String(l.count).length + 6;
    const hitsBox = nodes.some((n) => Math.abs(x - n.x) < n.w / 2 + w / 2 + 2 && Math.abs(y - n.y) < 13 + 8);
    const hitsCount = placed.some((p) => Math.abs(x - p.x) < (w + p.w) / 2 && Math.abs(y - p.y) < 13);
    l.spare = hitsBox || hitsCount;
    if (!l.spare) placed.push({ x, y, w });
  }
}

// ---- canvas -------------------------------------------------------------
const Canvas = (function () {
  let el, svg, root, zoom, nodes = [], moved = false;
  const W = () => el.clientWidth, H = () => el.clientHeight;

  // A domain's outline: a smooth hull around its ring of points, so even a one-capability
  // domain gets a rounded blob.
  function hullPath(pts) {
    const h = d3.polygonHull(ringAround(pts));
    return h ? d3.line().curve(d3.curveCatmullRomClosed.alpha(0.6))(h) : "";
  }

  return {
    mount(container) {
      el = container;
      svg = d3.select(el).append("svg");
      root = svg.append("g");
      zoom = d3.zoom().scaleExtent([0.15, 3]).on("zoom", (e) => {
        root.attr("transform", e.transform);
        if (e.sourceEvent) moved = true;  // the user panned or zoomed, not fit()
      });
      svg.call(zoom).on("dblclick.zoom", null);
    },
    render(g) {
      root.selectAll("*").remove();
      // Settle the layout before showing it, so nothing drifts into place on screen.
      const best = layout(g.caps.map((c) => ({ ...c, w: c.label.length * 6.8 + 20 })), g.links);
      nodes = best.nodes;
      const links = best.links;
      links.forEach((d) => Object.assign(d, route(d, best.slot)));
      placeCounts(links, nodes);

      const hullG = root.append("g"), linkG = root.append("g"), nodeG = root.append("g"), labelG = root.append("g");
      const hulls = hullG.selectAll("g").data(g.domains).join("g");
      hulls.append("path").attr("class", "hull");
      hulls.append("text").attr("class", "hull-label").attr("text-anchor", "middle").text((d) => d.id);

      // Lines run between box edges; light ones fade back so the heavy ones carry the picture.
      const link = linkG.selectAll("path").data(links).join("path")
        .attr("class", "share").attr("stroke-width", (d) => lineWidth(d.count))
        .attr("stroke-opacity", (d) => 0.25 + 0.55 * weightOf(d.count, best.max))
        .attr("d", (d) => d.d);
      const linkLabel = labelG.selectAll("text").data(links).join("text")
        .attr("class", (d) => "share-label" + (d.spare ? " spare" : "")).attr("text-anchor", "middle")
        .attr("x", (d) => d.mid[0]).attr("y", (d) => d.mid[1] + 3).text((d) => d.count);

      const node = nodeG.selectAll("g").data(nodes, (d) => d.id).join("g").attr("class", "cap")
        .attr("transform", (d) => `translate(${d.x},${d.y})`);
      node.append("rect").attr("rx", 6).attr("height", 26).attr("y", -13)
        .attr("width", (d) => d.w).attr("x", (d) => -d.w / 2);
      node.append("text").attr("text-anchor", "middle").attr("dy", 4).text((d) => d.label);

      hulls.each(function (d) {
        const pts = nodes.filter((n) => n.domain === d.id);
        d3.select(this).select("path").attr("d", hullPath(pts));
        d3.select(this).select("text").attr("x", d3.mean(pts, (p) => p.x)).attr("y", d3.min(pts, (p) => p.y) - 38);
      });

      // Hover a capability (or tap it, to keep it) to bring its lines and counts forward.
      let pinned = null;
      const focus = (f) => {
        const near = new Set(f ? [f] : []);
        links.forEach((l) => { if (l.source === f) near.add(l.target); if (l.target === f) near.add(l.source); });
        if (near.size === 1) f = null;  // nothing linked: dimming the rest would only hide the map
        const on = (l) => !!f && (l.source === f || l.target === f);
        svg.classed("focus", !!f);
        link.classed("on", on);
        linkLabel.classed("on", on);
        node.classed("on", (n) => near.has(n));
      };
      node.on("mouseenter", (e, d) => focus(d)).on("mouseleave", () => focus(pinned))
        .on("click", (e, d) => { e.stopPropagation(); pinned = pinned === d ? null : d; focus(pinned); });
      svg.on("click", () => { pinned = null; focus(null); });
      this.fit(0);
    },
    fit(ms = 450) {
      moved = false;
      if (!nodes.length || !W() || !H()) return;
      // Box edges, not centres, so a long name at the side isn't cut off.
      const x0 = d3.min(nodes, (d) => d.x - d.w / 2), x1 = d3.max(nodes, (d) => d.x + d.w / 2);
      const [y0, y1] = d3.extent(nodes, (d) => d.y);
      const pad = 60, k = Math.max(0.15, Math.min(2, 0.95 / Math.max((x1 - x0 + pad * 2) / W(), (y1 - y0 + pad * 2) / H())));
      const t = d3.zoomIdentity.translate(W() / 2, H() / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
      (ms ? svg.transition().duration(ms) : svg).call(zoom.transform, t);
    },
    // On resize, refit only while the user hasn't moved the view themselves.
    refit() { if (!moved) this.fit(0); },
  };
})();

// ---- page ---------------------------------------------------------------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function summary(d) {
  // Domains with no capabilities draw no outline, so they aren't counted either.
  const n = d.nodes.length, doms = toGraph(d).domains.length, links = d.edges.length;
  return `<h2>${esc(d.repo)}</h2>
    <p>${n} capabilit${n === 1 ? "y" : "ies"} · ${doms} domain${doms === 1 ? "" : "s"} · ${links} shared-file link${links === 1 ? "" : "s"}</p>
    <p class="muted">Outlines are domains. A line joins two capabilities whose anchors match the same files; its label is how many, and it is thicker for more.</p>`;
}

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("repo").textContent = DATA.repo;
  document.getElementById("panel").innerHTML = summary(DATA);
  Canvas.mount(document.getElementById("graph"));
  Canvas.render(toGraph(DATA));
  document.getElementById("fit").onclick = () => Canvas.fit();
  window.addEventListener("resize", () => Canvas.refit());
});
</script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capability map</title>
<!-- Written by skills/blueprint/scripts/graph.py: d3 and the data are inlined at the two markers below. -->
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e4e2dd;
  --node: #ffffff; --node-line: #b9b6ae; --domain: #f1efe9; --domain-line: #d9d5cb;
  --accent: #2f6fde; --edge: #8f8b82;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161617; --panel: #1f1f21; --ink: #ececee; --muted: #9a9aa0; --line: #333336;
    --node: #2a2a2d; --node-line: #55555a; --domain: #222225; --domain-line: #3a3a3e;
    --accent: #6ea0ff; --edge: #77777d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .tag { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
header .spacer { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
#graph { position: relative; overflow: hidden; min-height: 0; }
#graph .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px; min-height: 0; }
aside h2 { font-size: 15px; margin: 0 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
aside p { margin: 6px 0; } aside .muted { color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
}

svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }
.hull { fill: var(--domain); stroke: var(--domain-line); stroke-dasharray: 5 4; }
.hull-label { fill: var(--muted); font-size: 13px; font-weight: 600; pointer-events: none; }
.share { stroke: var(--edge); stroke-opacity: .7; }
.share-label { fill: var(--muted); font-size: 10px; pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.cap rect { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; }
.cap text { fill: var(--ink); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
</style>
<script>/*D3*/</script>
</head><body>
<div class="app">
  <header><h1>Capability map</h1><span class="tag" id="repo"></span><span class="spacer"></span>
    <button id="fit">Fit</button></header>
  <div id="graph"><div class="hint">scroll to zoom · drag to pan</div></div>
  <aside id="panel"></aside>
</div>
<script>
const DATA = /*DATA*/;

// ---- data → graph -------------------------------------------------------
// Turns graph.py's output into what the canvas draws: capability nodes, one line per
// pair of capabilities sharing files (weighted by the count), and one outline per domain.
function toGraph(d) {
  return {
    domains: d.domains.filter((dom) => d.nodes.some((n) => n.domain === dom.id)),
    caps: d.nodes.map((n) => ({ id: n.id, label: n.id, domain: n.domain })),
    links: d.edges.map((e) => ({ id: e.source + "~" + e.target, source: e.source, target: e.target, count: e.count })),
  };
}

// Line width grows with the number of shared files, with a ceiling so big overlaps stay readable.
const lineWidth = (count) => Math.min(12, 1.2 + 1.6 * Math.sqrt(count));

// Keeps the boxes themselves apart, not circles around them: a long name is wide but only
// 26px tall, so a circle of half its width would push neighbours far away above and below.
function rectCollide(pad) {
  let nodes = [];
  function force(alpha) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = b.x + b.vx - a.x - a.vx, dy = b.y + b.vy - a.y - a.vy;
        const ox = (a.w + b.w) / 2 + pad - Math.abs(dx), oy = 26 + pad - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        // Separate along the axis that needs the smaller move.
        if (ox < oy) { const m = (dx < 0 ? -1 : 1) * ox * 0.5 * Math.min(1, alpha * 4); a.vx -= m; b.vx += m; }
        else { const m = (dy < 0 ? -1 : 1) * oy * 0.5 * Math.min(1, alpha * 4); a.vy -= m; b.vy += m; }
      }
    }
  }
  force.initialize = (n) => { nodes = n; };
  return force;
}

// ---- canvas -------------------------------------------------------------
const Canvas = (function () {
  let el, svg, root, zoom, nodes = [], moved = false;
  const W = () => el.clientWidth, H = () => el.clientHeight;

  // A domain's outline: a ring of points around each capability, wrapped in a smooth hull,
  // so even a one-capability domain gets a rounded blob.
  function hullPath(pts) {
    const ring = pts.flatMap((p) => d3.range(10).map((i) => [
      p.x + (p.w / 2 + 16) * Math.cos(i / 10 * 2 * Math.PI),
      p.y + 30 * Math.sin(i / 10 * 2 * Math.PI)]));
    const h = d3.polygonHull(ring);
    return h ? d3.line().curve(d3.curveCatmullRomClosed.alpha(0.6))(h) : "";
  }

  return {
    mount(container) {
      el = container;
      svg = d3.select(el).append("svg");
      root = svg.append("g");
      zoom = d3.zoom().scaleExtent([0.15, 3]).on("zoom", (e) => {
        root.attr("transform", e.transform);
        if (e.sourceEvent) moved = true;  // the user panned or zoomed, not fit()
      });
      svg.call(zoom).on("dblclick.zoom", null);
    },
    render(g) {
      root.selectAll("*").remove();
      // Each domain pulls its capabilities toward a point on a circle. Capabilities outside any
      // domain get a point of their own, so they never settle inside a domain's outline.
      const BARE = "\u0000bare";
      const slots = g.domains.map((d) => d.id);
      if (g.caps.some((c) => !c.domain)) slots.push(BARE);
      const spread = slots.length > 1 ? 120 + 40 * slots.length : 0;
      const anchor = Object.fromEntries(slots.map((id, i) => [id, {
        x: Math.cos(i / slots.length * 2 * Math.PI) * spread,
        y: Math.sin(i / slots.length * 2 * Math.PI) * spread }]));
      const at = (d) => anchor[d.domain || BARE];
      nodes = g.caps.map((c) => ({ ...c, w: c.label.length * 6.8 + 20 }));
      const links = g.links.map((l) => ({ ...l }));

      const hullG = root.append("g"), linkG = root.append("g"), nodeG = root.append("g"), labelG = root.append("g");
      const hulls = hullG.selectAll("g").data(g.domains).join("g");
      hulls.append("path").attr("class", "hull");
      hulls.append("text").attr("class", "hull-label").attr("text-anchor", "middle").text((d) => d.id);

      const link = linkG.selectAll("line").data(links).join("line")
        .attr("class", "share").attr("stroke-width", (d) => lineWidth(d.count));
      const linkLabel = labelG.selectAll("text").data(links).join("text")
        .attr("class", "share-label").attr("text-anchor", "middle").text((d) => d.count);

      const node = nodeG.selectAll("g").data(nodes, (d) => d.id).join("g").attr("class", "cap");
      node.append("rect").attr("rx", 6).attr("height", 26).attr("y", -13)
        .attr("width", (d) => d.w).attr("x", (d) => -d.w / 2);
      node.append("text").attr("text-anchor", "middle").attr("dy", 4).text((d) => d.label);

      // Settle the layout before showing it, so nothing drifts into place on screen.
      d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.source.w + l.target.w) / 2 + 50).strength(0.25))
        .force("charge", d3.forceManyBody().strength(-380))
        .force("collide", rectCollide(12))
        .force("x", d3.forceX((d) => at(d).x).strength(0.14))
        .force("y", d3.forceY((d) => at(d).y).strength(0.14))
        .stop()
        .tick(400);

      // Lines run between box edges, and the count sits mid-way along the visible part.
      links.forEach((d) => {
        const a = d.source, b = d.target, dx = b.x - a.x, dy = b.y - a.y;
        const cut = (n) => Math.min(dx ? n.w / 2 / Math.abs(dx) : Infinity, dy ? 13 / Math.abs(dy) : Infinity);
        const s = Math.min(0.5, cut(a)), t = Math.max(0.5, 1 - cut(b));
        Object.assign(d, { x1: a.x + dx * s, y1: a.y + dy * s, x2: a.x + dx * t, y2: a.y + dy * t });
      });
      link.attr("x1", (d) => d.x1).attr("y1", (d) => d.y1).attr("x2", (d) => d.x2).attr("y2", (d) => d.y2);
      linkLabel.attr("x", (d) => (d.x1 + d.x2) / 2).attr("y", (d) => (d.y1 + d.y2) / 2 + 3);
      node.attr("transform", (d) => `translate(${d.x},${d.y})`);
      hulls.each(function (d) {
        const pts = nodes.filter((n) => n.domain === d.id);
        d3.select(this).select("path").attr("d", hullPath(pts));
        d3.select(this).select("text").attr("x", d3.mean(pts, (p) => p.x)).attr("y", d3.min(pts, (p) => p.y) - 38);
      });
      this.fit(0);
    },
    fit(ms = 450) {
      moved = false;
      if (!nodes.length || !W() || !H()) return;
      // Box edges, not centres, so a long name at the side isn't cut off.
      const x0 = d3.min(nodes, (d) => d.x - d.w / 2), x1 = d3.max(nodes, (d) => d.x + d.w / 2);
      const [y0, y1] = d3.extent(nodes, (d) => d.y);
      const pad = 60, k = Math.max(0.15, Math.min(2, 0.95 / Math.max((x1 - x0 + pad * 2) / W(), (y1 - y0 + pad * 2) / H())));
      const t = d3.zoomIdentity.translate(W() / 2, H() / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
      (ms ? svg.transition().duration(ms) : svg).call(zoom.transform, t);
    },
    // On resize, refit only while the user hasn't moved the view themselves.
    refit() { if (!moved) this.fit(0); },
  };
})();

// ---- page ---------------------------------------------------------------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function summary(d) {
  // Domains with no capabilities draw no outline, so they aren't counted either.
  const n = d.nodes.length, doms = toGraph(d).domains.length, links = d.edges.length;
  return `<h2>${esc(d.repo)}</h2>
    <p>${n} capabilit${n === 1 ? "y" : "ies"} · ${doms} domain${doms === 1 ? "" : "s"} · ${links} shared-file link${links === 1 ? "" : "s"}</p>
    <p class="muted">Outlines are domains. A line joins two capabilities whose anchors match the same files; its label is how many, and it is thicker for more.</p>`;
}

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("repo").textContent = DATA.repo;
  document.getElementById("panel").innerHTML = summary(DATA);
  Canvas.mount(document.getElementById("graph"));
  Canvas.render(toGraph(DATA));
  document.getElementById("fit").onclick = () => Canvas.fit();
  window.addEventListener("resize", () => Canvas.refit());
});
</script>
</body></html>
